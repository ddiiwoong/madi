name: Madi
options:
  bundleIdPrefix: dev.jinwoong
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # 개발 언어는 한국어다 — 소스의 `String(localized:)` 키가 한국어 문장이고, 영어는
  # `en.lproj`의 번역이다. 영어로 두면 한국어 사용자에게도 영어 표가 대신 읽힌다
  # (번들은 고른 언어에 표가 없으면 개발 언어의 표로 내려간다 — 실측).
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  Madi:
    type: application
    platform: macOS
    sources:
      - path: Sources/Madi
        excludes:
          - "Resources/Info.plist"
          # 저장소용 설명이다 — 앱에는 글꼴과 라이선스 전문만 들어간다.
          - "Resources/Fonts/README.md"
          # 아래에서 폴더째 넣는다. 여기 두면 파일이 Resources 바로 아래로 펴진다.
          - "Resources/Diagrams"
          - "Resources/Diagrams/**"
      # 다이어그램·수식 페이지는 **폴더 참조**로 넣는다. KaTeX의 CSS가 `fonts/KaTeX_*.woff2`를
      # 상대 경로로 부르므로, 다른 자원처럼 납작하게 펴면 수식이 글꼴 없이 그려진다.
      - path: Sources/Madi/Resources/Diagrams
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Sources/Madi/Resources/Info.plist
        # 이름은 Md → Madi로 바뀌었지만 식별자는 `dev.jinwoong.md` 그대로다.
        # 창 위치·크기(setFrameAutosaveName)와 최근 문서 목록은 번들 식별자로
        # 저장되므로, 바꾸면 기존 설치본의 그 상태가 한 번 초기화된다. 이름은
        # 사람이 읽는 것이고 식별자는 시스템이 읽는 것이라 같이 움직일 필요가 없다.
        PRODUCT_BUNDLE_IDENTIFIER: dev.jinwoong.md
        # 모듈 이름도 이 값에서 온다. Info.plist의 `NSDocumentClass`가
        # `<모듈>.MarkdownDocument` 꼴이므로 둘은 반드시 함께 움직인다.
        PRODUCT_NAME: Madi
        COMBINE_HIDPI_IMAGES: "YES"
        ENABLE_APP_SANDBOX: "NO"

  MadiTests:
    type: bundle.unit-test
    platform: macOS
    # Deliberately NOT app-hosted. The core is pure Foundation, so the test
    # bundle compiles those files directly: an app-hosted bundle has to launch
    # Madi.app and wait for it to connect, which hangs the run and tells you
    # nothing about the logic under test.
    #
    # Editor도 함께 컴파일한다. 블록 편집기(단계 1)의 되돌리기·블록 넘는 선택·
    # 한글 조합 보호는 **응답자 연쇄와 `NSTextView`를 지나야** 참임을 알 수 있고,
    # 순수 모델 테스트만으로는 배선이 끊긴 것을 못 잡는다 — 실제로 ⌘A가 모델에는
    # 실리는데 뷰에 싣는 순간 한 블록으로 줄어드는 결함을 UI로 더듬다 놓쳤다.
    # 창은 화면 밖에 만들므로 사용자의 화면을 가로채지 않는다.
    # 설정 창도 넣는다. 설정 항목이 **실제로 저장되는지**는 컨트롤의 target-action을
    # 지나야 알 수 있고, 이 환경에서는 패널에 좌표 클릭이 닿지 않아(네 번 시도) UI로는
    # 확인할 길이 없었다 — 전에 "체크박스 클릭 자체는 확인하지 못했다"고 적어 둔 구멍이
    # 바로 이것이다. 테스트가 그 경로를 지난다.
    # 2026-11-05부터 **앱의 거의 전부**를 넣는다(`main.swift`만 뺀다). 문서 창
    # (`DocumentWindowController`)의 도구 막대 토글·메뉴 체크·새 창의 초기 보기·front matter
    # 보존은 앱을 띄워 눈으로만 확인했고, 그 자리에서 메뉴 활성화 회귀를 한 번 냈다. 그 컨트롤러는
    # 문서·패널·서비스를 모두 끌어오므로 폴더째 넣는다. `main.swift`는 앱을 실행하는
    # 최상위 코드라 테스트 번들에 들어오면 안 된다.
    # 테스트는 시스템에 기대는 길(번역 가능 여부, 키체인 값 꺼내기, 네트워크)을 부르지 않거나
    # 대역을 넣는다 — 각 테스트 파일의 머리말.
    sources:
      - Tests/MadiTests
      - Sources/Madi/Core
      - Sources/Madi/Editor
      - Sources/Madi/Panels
      - Sources/Madi/Services
      - path: Sources/Madi/App
        excludes:
          - "main.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jinwoong.md.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Madi:
    build:
      targets:
        Madi: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MadiTests
