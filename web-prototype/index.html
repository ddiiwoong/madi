<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>md — 마크다운 에디터</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body data-view="split">

<header class="toolbar">
  <div class="toolbar-left">
    <button type="button" id="outline-toggle" class="icon-button" title="목차 (개요)" aria-label="목차">☰</button>
    <span id="doc-name" class="doc-name">untitled.md</span>
  </div>

  <div class="toolbar-right">
    <span id="match-count" class="match-count" hidden></span>
    <button type="button" id="search-toggle" class="icon-button" title="검색 (⌘F)" aria-label="검색">⌕</button>
    <label id="search-field" class="search-field">
      <input id="search-input" type="search" placeholder="문서 내 검색 (⌘F)"
             autocapitalize="none" autocorrect="off" spellcheck="false">
    </label>
    <button type="button" id="view-toggle" class="text-button" title="보기 전환 (⌘E)">분할</button>
    <button type="button" id="open-file" class="text-button" title="열기 (⌘O)">열기</button>
    <button type="button" id="save-file" class="text-button" title="저장 (⌘S)">저장</button>
    <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,text/markdown" hidden>
  </div>
</header>

<main class="workspace">
  <aside id="outline" class="outline" aria-label="문서 목차"></aside>

  <section class="pane pane-source">
    <div id="source-highlight" class="source-highlight" aria-hidden="true"></div>
    <textarea id="source" class="source" spellcheck="false" autocapitalize="none"
              aria-label="마크다운 소스"># md

의존성 없는 마크다운 에디터입니다. 왼쪽에 쓰면 오른쪽에 바로 보입니다.

## 검색

`⌘F`로 검색창을 열면 **문서 안의 모든 일치**가 호박색으로 칠해집니다.
대소문자는 무시하고, 정규식은 쓰지 않는 단순 부분문자열 검색입니다.

```js
// 코드 블록 안은 일부러 강조하지 않습니다
const query = 'search';
```

- [x] 소스·미리보기 양쪽 동시 강조
- [x] 코드 블록 제외
- [ ] 직접 문서를 열어 보기 (`⌘O`)

> 자세한 설계 근거는 README.md에 있습니다.
</textarea>
  </section>

  <section id="preview" class="pane pane-preview markdown-body" aria-label="미리보기"></section>
</main>

<div id="status" class="status" role="status" aria-live="polite"></div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
